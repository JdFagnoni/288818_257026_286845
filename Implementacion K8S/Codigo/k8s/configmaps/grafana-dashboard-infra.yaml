apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-infra
  namespace: pharmago
data:
  pharmago-infra.json: |
    {"title":"PharmaGo - Infra","uid":"pharmago-infra","tags":["pharmago","infra"],"time":{"from":"now-15m","to":"now"},"panels":[{"id":1,"title":"CPU %","type":"timeseries","gridPos":{"x":0,"y":0,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))","legendFormat":"{{node}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}}},{"id":2,"title":"Memoria usada %","type":"timeseries","gridPos":{"x":12,"y":0,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100","legendFormat":"{{node}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}}},{"id":3,"title":"Disco disponible %","type":"timeseries","gridPos":{"x":0,"y":8,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"min by (node) (100 * node_filesystem_avail_bytes{mountpoint=~\"/|/data\",fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{mountpoint=~\"/|/data\",fstype!~\"tmpfs|overlay|squashfs\"})","legendFormat":"{{node}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}}},{"id":4,"title":"CPU por pod (pharmago)","type":"timeseries","gridPos":{"x":12,"y":8,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"pharmago\"}[5m])) * 100","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}}},{"id":5,"title":"Memoria por pod (pharmago)","type":"timeseries","gridPos":{"x":0,"y":16,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"pharmago\"})","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"bytes","min":0},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}}},{"id":6,"title":"Red recibida por nodo","type":"timeseries","gridPos":{"x":0,"y":24,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (node) (rate(node_network_receive_bytes_total{device!=\"lo\"}[5m]))","legendFormat":"{{node}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"Bps","min":0}}},{"id":7,"title":"Red transmitida por nodo","type":"timeseries","gridPos":{"x":12,"y":24,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (node) (rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m]))","legendFormat":"{{node}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"Bps","min":0}}},{"id":8,"title":"Storage efímero por pod (pharmago)","type":"timeseries","gridPos":{"x":0,"y":32,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"k8s_pod_filesystem_usage_bytes{k8s_namespace_name=\"pharmago\"}","legendFormat":"{{k8s_pod_name}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"bytes","min":0}}},{"id":9,"title":"Red recibida por pod (pharmago)","type":"timeseries","gridPos":{"x":12,"y":32,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"pharmago\",pod!=\"\"}[5m]))","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"Bps","min":0}}},{"id":10,"title":"Red transmitida por pod (pharmago)","type":"timeseries","gridPos":{"x":0,"y":40,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"pharmago\",pod!=\"\"}[5m]))","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"Bps","min":0}}}],"schemaVersion":38,"version":0}
