log_format pharmago_json escape=json
  '{"Timestamp":"$time_iso8601","LogLevel":"Information","Category":"nginx.access",'
  '"Message":"$request_method $uri","service":"pharmago-ui",'
  '"request_id":"$request_id","correlation_id":"$http_x_correlation_id",'
  '"method":"$request_method","path":"$uri","status":$status,'
  '"bytes_sent":$body_bytes_sent,"request_time_seconds":$request_time,'
  '"remote_addr":"$remote_addr","user_agent":"$http_user_agent"}';

server {
  listen       80;
  server_name  localhost 127.0.0.1;
  root   /usr/share/nginx/html;
  index  index.html;
  access_log /dev/stdout pharmago_json;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
