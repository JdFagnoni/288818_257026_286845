apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-api-gateway
  namespace: pharmago
spec:
  replicas: 2
  # Reemplazo sin caída: primero se levanta un pod nuevo y recién cuando está
  # Ready se baja uno viejo.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pharmago-api-gateway
  template:
    metadata:
      labels:
        app: pharmago-api-gateway
        workload-class: pharmago-backend-microservice
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [backend]
        # Dos microservicios distintos nunca comparten nodo.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: workload-class
                operator: In
                values: [pharmago-backend-microservice]
              - key: app
                operator: NotIn
                values: [pharmago-api-gateway]
            topologyKey: kubernetes.io/hostname
        # Las réplicas de este servicio van juntas a su propio nodo: si se
        # repartieran, ocuparían el nodo de otro microservicio.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: pharmago-api-gateway
            topologyKey: kubernetes.io/hostname
      containers:
      - name: pharmago-api-gateway
        image: pharmago-api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        # Recursos reducidos para nodos ~5GB (proyecto docente)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        # El pod sigue atendiendo mientras el Service deja de mandarle tráfico;
        # sin esta pausa se pierden requests al bajarlo.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        startupProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

