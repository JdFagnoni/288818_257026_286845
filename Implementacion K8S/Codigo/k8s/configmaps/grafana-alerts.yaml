apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts
  namespace: pharmago
data:
  pharmago-alerts.json: |
    {
      "apiVersion": 1,
      "groups": [
        {
          "orgId": 1,
          "name": "Infraestructura PharmaGo",
          "folder": "PharmaGo",
          "interval": "30s",
          "rules": [
            {
              "uid": "node-cpu-high",
              "title": "CPU de nodo alta",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "prometheus",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
                    "instant": true,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "$A > 85",
                    "type": "math",
                    "refId": "B"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "2m",
              "annotations": {
                "summary": "CPU del nodo supera 85% durante 2 minutos."
              },
              "labels": {
                "severity": "warning",
                "component": "telemetry"
              }
            },
            {
              "uid": "node-memory-high",
              "title": "Memoria de nodo alta",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "prometheus",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
                    "instant": true,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "$A > 90",
                    "type": "math",
                    "refId": "B"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "2m",
              "annotations": {
                "summary": "Memoria usada del nodo supera 90% durante 2 minutos."
              },
              "labels": {
                "severity": "warning",
                "component": "telemetry"
              }
            },
            {
              "uid": "node-disk-low",
              "title": "Espacio de disco bajo",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "prometheus",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "min by (node) (100 * node_filesystem_avail_bytes{mountpoint=~\"/|/data\",fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{mountpoint=~\"/|/data\",fstype!~\"tmpfs|overlay|squashfs\"})",
                    "instant": true,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "$A < 15",
                    "type": "math",
                    "refId": "B"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "2m",
              "annotations": {
                "summary": "Espacio disponible en el filesystem principal menor a 15% durante 2 minutos."
              },
              "labels": {
                "severity": "warning",
                "component": "telemetry"
              }
            },
            {
              "uid": "node-network-errors",
              "title": "Errores de red de nodo",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "prometheus",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "sum by (node) (rate(node_network_receive_errs_total{device!=\"lo\"}[5m]) + rate(node_network_transmit_errs_total{device!=\"lo\"}[5m]))",
                    "instant": true,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "$A > 0",
                    "type": "math",
                    "refId": "B"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "2m",
              "annotations": {
                "summary": "Hay errores de recepción o transmisión de red durante 2 minutos."
              },
              "labels": {
                "severity": "warning",
                "component": "telemetry"
              }
            },
            {
              "uid": "pod-cpu-high",
              "title": "CPU de pod alta",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "prometheus",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"pharmago\",id=~\".*pod[^/]*\"}[5m]))",
                    "instant": true,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "$A > 0.4",
                    "type": "math",
                    "refId": "B"
                  }
                }
              ],
              "noDataState": "NoData",
              "execErrState": "Alerting",
              "for": "2m",
              "annotations": {
                "summary": "Un pod usa más de 0.4 núcleos de CPU durante 2 minutos."
              },
              "labels": {
                "severity": "warning",
                "component": "telemetry"
              }
            }
          ]
        },
        {
          "orgId": 1,
          "name": "Servicio PharmaGo",
          "folder": "PharmaGo",
          "interval": "10s",
          "rules": [
            {
              "uid": "gateway-5xx-rate",
              "title": "Errores 5xx en el gateway",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "prometheus",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "(100 * sum(rate(pharmago_http_requests_total{job=\"PharmaGo.ApiGateway\",endpoint!=\"/health\",status_code=~\"5..\"}[1m])) / sum(rate(pharmago_http_requests_total{job=\"PharmaGo.ApiGateway\",endpoint!=\"/health\"}[1m]))) and on() (sum(increase(pharmago_http_requests_total{job=\"PharmaGo.ApiGateway\",endpoint!=\"/health\",status_code=~\"5..\"}[1m])) >= 3)",
                    "instant": true,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "$A > 5",
                    "type": "math",
                    "refId": "B"
                  }
                }
              ],
              "noDataState": "OK",
              "execErrState": "Alerting",
              "for": "30s",
              "annotations": {
                "summary": "Más del 5% de las respuestas del gateway son 5xx (al menos 3 en el último minuto) durante 30 segundos. Suele ser un microservicio caído o inaccesible: con el circuito abierto, el gateway responde 503."
              },
              "labels": {
                "severity": "critical",
                "component": "telemetry"
              }
            },
            {
              "uid": "gateway-traffic-spike",
              "title": "Pico de requests en el gateway",
              "condition": "B",
              "data": [
                {
                  "refId": "A",
                  "datasourceUid": "prometheus",
                  "relativeTimeRange": {
                    "from": 300,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "prometheus"
                    },
                    "editorMode": "code",
                    "expr": "sum(rate(pharmago_http_request_duration_milliseconds_count{job=\"PharmaGo.ApiGateway\",endpoint!=\"/health\"}[1m]))",
                    "instant": true,
                    "range": false,
                    "refId": "A"
                  }
                },
                {
                  "refId": "B",
                  "datasourceUid": "__expr__",
                  "relativeTimeRange": {
                    "from": 0,
                    "to": 0
                  },
                  "model": {
                    "datasource": {
                      "type": "__expr__",
                      "uid": "__expr__"
                    },
                    "expression": "$A > 2",
                    "type": "math",
                    "refId": "B"
                  }
                }
              ],
              "noDataState": "OK",
              "execErrState": "Alerting",
              "for": "0s",
              "annotations": {
                "summary": "El gateway recibe más de 2 requests/s (promedio del último minuto). El rate limit admite 100 requests por minuto por IP: si el pico viene de pocos clientes, el excedente recibe 429."
              },
              "labels": {
                "severity": "warning",
                "component": "telemetry"
              }
            }
          ]
        }
      ]
    }
