apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pharmago
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    storage:
      tsdb:
        out_of_order_time_window: 30m

    otlp:
      promote_resource_attributes:
        - service.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.node.name

    scrape_configs:
      # Las demás métricas llegan por OTLP/HTTP desde el Collector.
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

